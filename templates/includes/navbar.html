<div class="navbar-left">
    {% include "includes/brand.html" %}
</div>

<div class="navbar-right">
    {% if request.user.is_authenticated %}
        <a href="{% url 'users:profile' %}" class="user-name profile-link">{{ request.user.username }}</a>
        {% if has_sync_identity and sync_role_label %}
        <span class="role-badge role-{{ sync_role }}">{{ sync_role_label }}</span>
        {% elif not has_sync_identity %}
        <span class="role-badge role-none">роль не привязана</span>
        {% endif %}

        <form method="post" action="{% url 'users:logout' %}" class="logout-form">
            {% csrf_token %}
            <button type="submit" class="btn btn-secondary">Выход</button>
        </form>
    {% else %}
        <a class="btn btn-secondary" href="{% url 'users:login' %}">Вход</a>
    {% endif %}
</div>
